<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Поймай звезду</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0d0d22;
    color: #fff;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    background:
      radial-gradient(ellipse at top, #1a1a4a 0%, #0d0d22 60%, #000 100%);
    overflow: hidden;
  }
  #hud {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    z-index: 10;
    font-size: 18px;
    font-weight: 600;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }
  #hud span { background: rgba(0,0,0,0.4); padding: 6px 12px; border-radius: 12px; backdrop-filter: blur(6px); }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(10px);
    z-index: 20;
    text-align: center;
    padding: 20px;
  }
  #overlay h1 {
    font-size: 36px;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #ffd966, #ff66c4);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  #overlay p { font-size: 16px; opacity: 0.85; margin-bottom: 24px; max-width: 280px; line-height: 1.4; }
  #overlay button {
    padding: 14px 36px;
    font-size: 18px;
    font-weight: 700;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, #ffd966, #ff66c4);
    color: #1a1a4a;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(255, 102, 196, 0.5);
    transition: transform 0.1s;
  }
  #overlay button:active { transform: scale(0.96); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span id="score">⭐ 0</span>
    <span id="time">⏱ 30</span>
  </div>
  <canvas id="game"></canvas>
  <div id="overlay">
    <h1 id="title">Поймай звезду</h1>
    <p id="desc">Лови падающие звёзды пальцем (или мышкой)!<br>У тебя 30 секунд. Не лови бомбы 💣</p>
    <button id="startBtn">Играть</button>
  </div>
</div>

<script>
(() => {
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const timeEl = document.getElementById("time");
  const overlay = document.getElementById("overlay");
  const titleEl = document.getElementById("title");
  const descEl = document.getElementById("desc");
  const startBtn = document.getElementById("startBtn");

  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = canvas.clientWidth = window.innerWidth;
    H = canvas.clientHeight = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  const stars = [];
  let score = 0, timeLeft = 30, running = false, lastSpawn = 0, last = 0;

  function spawn() {
    const isBomb = Math.random() < 0.18;
    stars.push({
      x: Math.random() * (W - 40) + 20,
      y: -30,
      vy: 90 + Math.random() * 140,
      r: 16 + Math.random() * 8,
      bomb: isBomb,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 4,
    });
  }

  function drawStar(x, y, r, rot, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 18;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const ang = (Math.PI / 5) * i;
      const rad = i % 2 === 0 ? r : r / 2.2;
      ctx.lineTo(Math.cos(ang) * rad, Math.sin(ang) * rad);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawBomb(x, y, r) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = "#222";
    ctx.shadowColor = "#ff3b3b";
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#ff8";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -r);
    ctx.quadraticCurveTo(r * 0.7, -r * 1.4, r * 0.9, -r * 1.6);
    ctx.stroke();
    ctx.fillStyle = "#ffeb3b";
    ctx.beginPath();
    ctx.arc(r * 0.95, -r * 1.65, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // звёздное небо на фоне
  const bgStars = Array.from({ length: 80 }, () => ({
    x: Math.random(),
    y: Math.random(),
    s: Math.random() * 1.5 + 0.3,
    a: Math.random(),
  }));

  function drawBg() {
    ctx.clearRect(0, 0, W, H);
    for (const s of bgStars) {
      ctx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(performance.now() / 1000 + s.a * 10));
      ctx.fillStyle = "#fff";
      ctx.fillRect(s.x * W, s.y * H, s.s, s.s);
    }
    ctx.globalAlpha = 1;
  }

  function tick(now) {
    if (!running) return;
    const dt = Math.min(0.05, (now - last) / 1000 || 0);
    last = now;

    drawBg();

    if (now - lastSpawn > 450) {
      spawn();
      lastSpawn = now;
    }

    for (let i = stars.length - 1; i >= 0; i--) {
      const o = stars[i];
      o.y += o.vy * dt;
      o.rot += o.vr * dt;
      if (o.bomb) drawBomb(o.x, o.y, o.r);
      else drawStar(o.x, o.y, o.r, o.rot, "#ffd966");
      if (o.y > H + 40) stars.splice(i, 1);
    }

    requestAnimationFrame(tick);
  }

  function timer() {
    if (!running) return;
    timeLeft--;
    timeEl.textContent = "⏱ " + timeLeft;
    if (timeLeft <= 0) endGame();
    else setTimeout(timer, 1000);
  }

  function hit(x, y) {
    for (let i = stars.length - 1; i >= 0; i--) {
      const o = stars[i];
      const dx = x - o.x, dy = y - o.y;
      if (dx * dx + dy * dy < (o.r + 8) ** 2) {
        if (o.bomb) {
          score = Math.max(0, score - 5);
          if (tg) tg.HapticFeedback?.notificationOccurred("error");
        } else {
          score += 1;
          if (tg) tg.HapticFeedback?.impactOccurred("light");
        }
        scoreEl.textContent = "⭐ " + score;
        stars.splice(i, 1);
        return;
      }
    }
  }

  function getPos(e) {
    const t = e.touches?.[0] || e.changedTouches?.[0] || e;
    const rect = canvas.getBoundingClientRect();
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }

  canvas.addEventListener("pointerdown", e => { if (running) { const p = getPos(e); hit(p.x, p.y); } });
  canvas.addEventListener("pointermove", e => { if (running && e.pressure > 0) { const p = getPos(e); hit(p.x, p.y); } });

  function startGame() {
    score = 0;
    timeLeft = 30;
    stars.length = 0;
    running = true;
    last = 0;
    lastSpawn = 0;
    scoreEl.textContent = "⭐ 0";
    timeEl.textContent = "⏱ 30";
    overlay.classList.add("hidden");
    requestAnimationFrame(tick);
    setTimeout(timer, 1000);
  }

  function endGame() {
    running = false;
    titleEl.textContent = "Игра окончена!";
    descEl.innerHTML = `Твой счёт: <b style="font-size:28px">⭐ ${score}</b><br><br>Хочешь ещё разок?`;
    startBtn.textContent = "Сыграть снова";
    overlay.classList.remove("hidden");

    if (tg) {
      try {
        tg.sendData(JSON.stringify({ game: "catch_star", score }));
      } catch (e) { /* ignore */ }
    }
  }

  startBtn.addEventListener("click", startGame);
})();
</script>
</body>
</html>
